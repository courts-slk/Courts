<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <pattern id="net" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M7 0 L14 7 L7 14 L0 7 Z" fill="none" stroke="rgba(200,188,140,0.20)" stroke-width="0.7"/>
    </pattern>
    <clipPath id="c"><circle cx="100" cy="100" r="83"/></clipPath>
  </defs>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="99" fill="#0d1a0f"/>

  <!-- Outer cream border ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c8b870" stroke-width="2.8"/>

  <!-- Second inner cream ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#c8b870" stroke-width="1.4"/>

  <!-- Dark fill + net texture in inner circle -->
  <circle cx="100" cy="100" r="83" fill="#111c13"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#net)" clip-path="url(#c)"/>

  <!-- ── Left side bracket ──────────────────────────────────── -->
  <!-- Vertical stems -->
  <line x1="22" y1="86" x2="22" y2="114" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Top arm -->
  <line x1="22" y1="86" x2="32" y2="86" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bottom arm -->
  <line x1="22" y1="114" x2="32" y2="114" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="19" cy="100" r="3.8" fill="#c8b870"/>

  <!-- ── Right side bracket ─────────────────────────────────── -->
  <line x1="178" y1="86" x2="178" y2="114" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="178" y1="86" x2="168" y2="86" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="178" y1="114" x2="168" y2="114" stroke="#c8b870" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="181" cy="100" r="3.8" fill="#c8b870"/>

  <!-- ── Thin horizontal rule lines ────────────────────────── -->
  <line x1="40" y1="79"  x2="160" y2="79"  stroke="#c8b870" stroke-width="0.9" opacity="0.55"/>
  <line x1="40" y1="123" x2="160" y2="123" stroke="#c8b870" stroke-width="0.9" opacity="0.55"/>

  <!-- ── COURTS wordmark ────────────────────────────────────── -->
  <text
    x="100" y="112"
    font-family="'Arial Black','Arial Bold','Franklin Gothic Heavy','Impact',sans-serif"
    font-size="36"
    font-weight="900"
    fill="#ddd0a0"
    text-anchor="middle"
    letter-spacing="5"
  >COURTS</text>
</svg>
