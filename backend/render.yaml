services:
  - type: web
    name: courts-api
    runtime: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/courts.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CORS_ORIGIN
        value: https://courts-api-aowc.onrender.com
